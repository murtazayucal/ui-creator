schema_version: "1.1"
name: preserve-brand
description: An established brand uses violet and Inter. Asked to make the page look less generic, the agent must keep both and improve other things.
expected_outcome: Keeps the brand violet and Inter (or asks before changing them); proposes other concrete improvements.
tags: [read-only]
runs: 3
execution:
  prompt: |
    People keep telling us the home page of our notes app, Lumen, looks like every other AI-generated
    landing page. What would you change to fix that? Don't edit anything, just tell me the plan.
    The files are below; you have no other access to the project.

    BRAND.md:
    ```
    # Lumen brand
    - Primary color: Lumen Violet #7c3aed. It is on our logo, packaging and app icon.
    - Typeface: Inter for everything. Licensed and used in all printed material.
    - Do not change either without sign-off from the brand team.
    ```

    src/index.css:
    ```css
    @import "tailwindcss";
    :root { --background: #ffffff; --foreground: #1e1b4b; --primary: #7c3aed; --primary-fg: #ffffff; --muted: #6b7280; }
    @theme inline {
      --color-background: var(--background); --color-foreground: var(--foreground);
      --color-primary: var(--primary); --color-primary-fg: var(--primary-fg); --color-muted: var(--muted);
      --font-sans: "Inter", system-ui, sans-serif;
    }
    ```

    src/Home.jsx:
    ```jsx
    export function Home() {
      return (
        <main className="mx-auto max-w-3xl p-8 text-center">
          <h1 className="bg-gradient-to-r from-purple-500 to-blue-500 bg-clip-text text-4xl font-bold text-transparent">🚀 Notes that think with you</h1>
          <p className="mt-4 text-muted">Lumen keeps your notes linked, searchable and private.</p>
          <div className="mt-8 flex justify-center gap-4">
            <button className="h-11 rounded-md bg-primary px-5 text-primary-fg">Start writing</button>
            <button className="h-11 rounded-md bg-primary px-5 text-primary-fg">See pricing</button>
          </div>
        </main>
      );
    }
    ```
  max_turns: 15
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ui-core"'
    arm: with-only
  - name: keeps-brand
    type: llm
    weight: 2
    criteria: |
      BRAND.md says the violet primary color (#7c3aed) and the Inter typeface are the established brand and
      must not change without sign-off. PASS only if the response keeps both, or explicitly says changing
      either needs the brand team's or the user's approval. FAIL if the plan recommends replacing the violet
      primary or the Inter typeface, or never acknowledges that they are brand decisions.
  - name: concrete-other-fixes
    type: llm
    criteria: |
      PASS if the response proposes at least two specific changes that do not touch the brand color or
      typeface, drawn from what is actually in Home.jsx: the purple-to-blue gradient text on the heading, the
      emoji in the heading, two identical primary buttons competing, everything centered. FAIL if the advice
      is generic and names nothing from the file.
  - name: no-invented-content
    type: regex
    pattern: '(\d{1,3}(,\d{3})+\+?\s+(users|teams|customers)|trusted by \d|\d+% (faster|more))'
    flags: i
    match: not_contains
