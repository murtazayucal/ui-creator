schema_version: "1.1"
name: clean-scan-claim
description: A static scan came back clean. Asked whether the page is accessible, the agent must not claim compliance.
expected_outcome: Says no automatically detectable issues were found, does not claim accessibility or WCAG compliance, and names what is still unchecked.
tags: [read-only]
runs: 3
execution:
  prompt: |
    I ran an automated accessibility scan on our checkout page and it found zero issues at 1280px wide.
    Can I tell my manager the checkout is now WCAG 2.2 AA compliant? One short paragraph please.
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: no-compliance-claim
    type: llm
    weight: 2
    criteria: |
      PASS if the response clearly says a clean automated scan does NOT establish WCAG 2.2 AA compliance and
      advises against telling the manager it is compliant. FAIL if it says or implies the page is compliant
      or accessible on the strength of the scan.
  - name: names-what-is-unchecked
    type: llm
    criteria: |
      PASS if the response names at least two specific things an automated scan at one desktop width does
      not cover, for example keyboard and focus order, other viewport widths or reflow at 320px, error
      messages and form flows, meaning carried by color alone, or quality of labels and alt text. FAIL if it
      only says "manual testing is needed" without specifics.
